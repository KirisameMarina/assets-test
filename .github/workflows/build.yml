name: Build & Publish

# 版本一变就重建站点，并把产物强制推送到 assets 分支。
#
# 为什么不用 GitHub Pages：国内直连 *.github.io 只有 12~20 KB/s（实测），
# 客户端在「Initialize Catalog」阶段就会超时。所以产物放仓库分支，
# 客户端通过 GitHub 加速站（ghfast）拉取，实测 450 KB/s ~ 1.8 MB/s。
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略版本比对，强制重建"
        type: boolean
        default: false
      tag:
        description: "指定上游 Release tag（留空用最新）"
        type: string
        default: ""

concurrency:
  group: build-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  BASE_URL: https://ghfast.top/raw.githubusercontent.com/${{ github.repository }}/assets

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      go: ${{ steps.decide.outputs.go }}
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read current version
        id: cur
        run: |
          set -euo pipefail
          if [ -f current.txt ]; then
            echo "version=$(tr -d '\r\n' < current.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Query upstream version
        id: ver
        run: |
          set -euo pipefail
          UP="https://raw.githubusercontent.com/Inf-Astra/Blue-Archive-Uncensor-Reborn/main_manual/current.txt"
          version=$(curl -fsSL --retry 4 --retry-delay 3 "$UP" | tr -d '\r' | sed -n 's/^ResourceVersion:[[:space:]]*//p')
          if [ -z "$version" ]; then echo "拿不到上游版本号"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "上游资源版本: $version"

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          cur='${{ steps.cur.outputs.version }}'
          new='${{ steps.ver.outputs.version }}'
          echo "上游版本: $new / 本站版本: ${cur:-（空）}"
          if [ '${{ inputs.force }}' = 'true' ] || [ -n '${{ inputs.tag }}' ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "强制构建"
          elif [ "$cur" != "$new" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "版本未变，跳过"
          fi

      - name: Build site
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          args=(--base-url "$BASE_URL" --catalog-source upstream \
                --version "${{ steps.ver.outputs.version }}")
          if [ -n '${{ inputs.tag }}' ]; then args+=(--tag '${{ inputs.tag }}'); fi
          python scripts/sync_mirror.py "${args[@]}"

      - name: Verify all required files
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("public/prodm39")
          # 客户端启动时按顺序请求这些，缺一个就「网络连接失败」
          cat = next(root.glob("AssetBundles/Catalog/*/Android/bundleDownloadInfo.json"))
          rv = cat.parts[-4]
          tv = next(root.glob("Manifest/TableBundles/*/TableManifest")).parts[-2]
          mv = next(root.glob("Manifest/MediaResources/*/MediaManifest")).parts[-2]
          required = [
              f"Manifest/TableBundles/{tv}/TableManifestHash",
              f"Manifest/TableBundles/{tv}/TableManifest",
              f"Manifest/MediaResources/{mv}/MediaManifestHash",
              f"Manifest/MediaResources/{mv}/MediaManifest",
              f"AssetBundles/Catalog/{rv}/Android/bundleDownloadInfo.hash",
              f"AssetBundles/Catalog/{rv}/Android/catalog_Android.hash",
              f"AssetBundles/Catalog/{rv}/Android/bundleDownloadInfo.json",
          ]
          bad = []
          for rel in required:
              p = root / rel
              print(f"{'OK  ' if p.is_file() else 'MISS'} {rel} {p.stat().st_size if p.is_file() else ''}")
              if not p.is_file():
                  bad.append(rel)

          manifest = json.loads((root / required[-1]).read_text(encoding="utf-8"))
          idx = {e["Name"]: e for e in manifest["BundleFiles"]}
          bundles = pathlib.Path(root / "AssetBundles/Android")
          files = list(bundles.glob("*.bundle"))
          mism = 0
          for p in files:
              h = hashlib.md5(p.read_bytes()).hexdigest()
              e = idx.get(p.name)
              if not e or e["Crc"] != h or e["Size"] != p.stat().st_size:
                  print(f"[MD5不一致] {p.name}")
                  mism += 1
          print(f"清单 {len(idx)} 条 / bundle {len(files)} 个 / MD5 不一致 {mism}")
          sys.exit(1 if (bad or mism or not files) else 0)
          PY

      - name: Publish assets branch
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          cd public
          git init -q -b assets
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "assets ${{ steps.ver.outputs.version }}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            assets:assets

      - name: Commit version
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.ver.outputs.version }}" > current.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: ${{ steps.ver.outputs.version }}"
          git push

      - name: Summary
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          {
            echo "### 已发布"
            echo
            echo "- 版本: \`${{ steps.ver.outputs.version }}\`"
            echo "- 清单: $BASE_URL/prodm39/AssetBundles/Catalog/${{ steps.ver.outputs.version }}/Android/bundleDownloadInfo.json"
            echo
            echo '手机 `files/LocalizeConfig.txt`：'
            echo '```'
            cat LocalizeConfig.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
